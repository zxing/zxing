name: Core Library Bug Report
description: Report a reproducible bug in the core ZXing Java library
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please read [CONTRIBUTING.md](https://github.com/zxing/zxing/blob/master/.github/CONTRIBUTING.md) before submitting.
        - **Maintenance Mode:** ZXing is not under active feature development. Feature requests, new barcode format requests, and general questions will be closed.
        - **Core Java Library Only:** Do not report issues with the retired Barcode Scanner Android app, device camera focus/hardware, or third-party ports (`ZXing.Net`, `zxing-cpp`, `html5-qrcode`, `zxing-js`, etc.).

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-Submission Checks
      options:
        - label: I have tested against the latest release/HEAD or the online decoder (https://zxing.org/w/decode.jspx).
          required: true
        - label: I have searched existing open and closed issues to confirm this is not a duplicate.
          required: true
        - label: This is a reproducible bug in the core Java library (`core` / `javase`), not a usage question, feature request, or Android app/camera issue.
          required: true

  - type: input
    id: version
    attributes:
      label: ZXing Version
      description: Exact Maven/Gradle version (e.g., `3.5.3`) or commit SHA.
      placeholder: "3.5.3"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Expected vs. Actual Behavior
      description: |
        State what you expected (including the **exact text/data encoded in the barcode**, if applicable) and what actually happened (e.g., `NotFoundException`, `ChecksumException`, `FormatException`, or incorrect decoded output).
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Sample Barcode Image & Reproduction Code
      description: |
        1. **Attach the original, unmodified barcode image** (required for decoding issues—avoid screenshots or photos of screens unless testing camera capture).
        2. Provide minimal Java reproduction code, including any `DecodeHintType` (e.g., `TRY_HARDER`, `PURE_BARCODE`, `POSSIBLE_FORMATS`) or `EncodeHintType` settings used.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & Stack Trace
      description: Include JDK version, OS, and any relevant exception stack trace.
      render: shell
